# Old domain: 301 everything to killmyidea.biz with path and query intact.
# Exempt: the one-time history hand-off (public/history-transfer.html), the API
# (tabs still open on the old domain) and ACME challenges for its certificate.
# #moved tells index.html to run the hand-off; crawlers ignore fragments.
set $kmi_moved 0;
if ($server_name = killmyidea.stemonte.io) { set $kmi_moved 1; }
if ($uri ~ ^/(api/|\.well-known/|history-transfer\.html$)) { set $kmi_moved 0; }
if ($kmi_moved) { return 301 "https://killmyidea.biz$request_uri#moved"; }
